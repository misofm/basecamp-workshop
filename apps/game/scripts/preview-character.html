<!doctype html><title>Character QA</title><body style="margin:0"><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(900,650);document.body.append(renderer.domElement);renderer.setClearColor('#5c6768');const scene=new T.Scene(),camera=new T.PerspectiveCamera(40,900/650,.1,50);camera.position.set(0,1.3,3.6);camera.lookAt(0,.9,0);scene.add(new T.HemisphereLight(0xffffff,0x443333,2));const l=new T.DirectionalLight(0xffffff,2);l.position.set(3,4,5);scene.add(l);
const gltf=await new GLTFLoader().loadAsync('/models/visitor.glb');scene.add(gltf.scene);const mixer=new T.AnimationMixer(gltf.scene);mixer.clipAction(gltf.animations.find(c=>c.name==='Idle')).play();mixer.update(.6);renderer.render(scene,camera);document.body.dataset.done='true';
console.log('bones',JSON.stringify(Object.fromEntries(['mixamorigHips','mixamorigHead','mixamorigLeftHand','mixamorigRightHand'].map(n=>[n,gltf.scene.getObjectByName(n).getWorldPosition(new T.Vector3()).toArray()]))));
</script></body>
