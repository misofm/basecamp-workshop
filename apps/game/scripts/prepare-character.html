<!doctype html><title>Prepare civilian character</title>
<script type="module">
  import * as THREE from "three";
  import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
  import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
  try {
    const loader = new GLTFLoader();
    const [source, target] = await Promise.all([
      loader.loadAsync("/scripts/assets/soldier.glb"),
      loader.loadAsync("/scripts/assets/michelle.glb"),
    ]);
    let sourceSkin, targetSkin;
    source.scene.traverse((o) => {
      if (o.isSkinnedMesh && !sourceSkin) sourceSkin = o;
    });
    target.scene.traverse((o) => {
      if (o.isSkinnedMesh) targetSkin = o;
    });
    // Normalize both reference rigs to their authored T-pose before sampling world deltas.
    for (const asset of [source, target]) {
      const referenceClip = asset.animations.find((c) => c.name === "TPose");
      if (referenceClip) {
        const referenceMixer = new THREE.AnimationMixer(asset.scene);
        referenceMixer.clipAction(referenceClip).play();
        referenceMixer.setTime(0);
      }
    }
    source.scene.rotation.y = Math.PI;
    source.scene.updateMatrixWorld(true);
    target.scene.updateMatrixWorld(true);
    const rest = new Map(),
      sourceBones = new Map();
    source.scene.traverse((b) => {
      if (b.isBone) sourceBones.set(b.name, b);
    });
    const targetBones = [];
    target.scene.traverse((b) => {
      if (b.isBone && sourceBones.has(b.name)) {
        const donor = sourceBones.get(b.name);
        targetBones.push(b);
        rest.set(b.name, {
          sourceWorld: donor.getWorldQuaternion(new THREE.Quaternion()),
          targetWorld: b.getWorldQuaternion(new THREE.Quaternion()),
          position: b.position.clone(),
          quaternion: b.quaternion.clone(),
          scale: b.scale.clone(),
        });
      }
    });
    const sourceHip = source.scene.getObjectByName("mixamorigHips"),
      targetHip = target.scene.getObjectByName("mixamorigHips");
    const sourceBase = sourceHip.getWorldPosition(new THREE.Vector3()),
      targetBase = targetHip.getWorldPosition(new THREE.Vector3());
    const clips = [];
    for (const original of source.animations.filter((c) =>
      ["Idle", "Walk", "Run"].includes(c.name),
    )) {
      const mixer = new THREE.AnimationMixer(source.scene);
      mixer.clipAction(original).play();
      const times = [],
        rotations = new Map(targetBones.map((b) => [b.name, []])),
        positions = [];
      const frames = Math.ceil(original.duration * 30);
      for (let frame = 0; frame <= frames; frame++) {
        const t = Math.min(frame / 30, original.duration - 0.00001);
        times.push(t);
        mixer.setTime(t);
        source.scene.updateMatrixWorld(true);
        for (const bone of targetBones) {
          const reference = rest.get(bone.name),
            donor = sourceBones.get(bone.name);
          const world = donor
            .getWorldQuaternion(new THREE.Quaternion())
            .multiply(reference.sourceWorld.clone().invert())
            .multiply(reference.targetWorld);
          const parent = bone.parent.getWorldQuaternion(new THREE.Quaternion());
          bone.quaternion.copy(parent.invert().multiply(world));
          if (bone === targetHip) {
            const desired = targetBase.clone();
            desired.y +=
              ((sourceHip.getWorldPosition(new THREE.Vector3()).y -
                sourceBase.y) *
                targetBase.y) /
              sourceBase.y;
            bone.position.copy(bone.parent.worldToLocal(desired));
            positions.push(...bone.position.toArray());
          }
          bone.updateMatrixWorld(true);
          rotations.get(bone.name).push(...bone.quaternion.toArray());
        }
      }
      const tracks = targetBones.map(
        (b) =>
          new THREE.QuaternionKeyframeTrack(
            b.name + ".quaternion",
            times,
            rotations.get(b.name),
          ),
      );
      tracks.push(
        new THREE.VectorKeyframeTrack(
          "mixamorigHips.position",
          times,
          positions,
        ),
      );
      clips.push(
        new THREE.AnimationClip(original.name, original.duration, tracks),
      );
      mixer.stopAllAction();
    }
    for (const bone of targetBones) {
      const r = rest.get(bone.name);
      bone.position.copy(r.position);
      bone.quaternion.copy(r.quaternion);
      bone.scale.copy(r.scale);
    }
    target.scene.updateMatrixWorld(true);
    console.log(
      "bounds",
      JSON.stringify(
        new THREE.Box3()
          .setFromObject(target.scene)
          .getSize(new THREE.Vector3()),
      ),
    );
    const result = await new GLTFExporter().parseAsync(target.scene, {
      binary: true,
      animations: clips,
    });
    let binary = "";
    const bytes = new Uint8Array(result);
    for (let i = 0; i < bytes.length; i += 32768)
      binary += String.fromCharCode(...bytes.subarray(i, i + 32768));
    await window.saveModel(btoa(binary));
    document.body.dataset.done = "true";
  } catch (error) {
    console.error(error);
    document.body.dataset.error = String(error);
  }
</script>
